<aside class="bg-gradient-to-br from-gray-800 to-gray-900 -translate-x-80 fixed inset-0 z-50 my-4 ml-4 h-[calc(100vh-32px)] w-72 rounded-xl transition-transform duration-300 xl:translate-x-0">
  <div class="relative border-b border-white/20">
    <a class="flex items-center gap-4 py-6 px-8" href="#/">
      <h6 class="block antialiased tracking-normal font-sans text-base font-semibold leading-relaxed text-white">Nami.ia</h6>
    </a>
    <button class="middle none font-sans font-medium text-center uppercase transition-all disabled:opacity-50 disabled:shadow-none disabled:pointer-events-none w-8 max-w-[32px] h-8 max-h-[32px] rounded-lg text-xs text-white hover:bg-white/10 active:bg-white/30 absolute right-0 top-0 grid rounded-br-none rounded-tl-none xl:hidden" type="button">
      <span class="absolute top-1/2 left-1/2 transform -translate-y-1/2 -translate-x-1/2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" aria-hidden="true" class="h-5 w-5 text-white">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </span>
    </button>
  </div>
  <div class="m-4">
    <ul class="mb-4 flex flex-col gap-1">
      <li>
        <a routerLink="/dashboard">
          <button routerLinkActive="bg-gradient-to-tr from-blue-600 to-blue-400 shadow-md shadow-blue-500/20 hover:shadow-lg hover:shadow-blue-500/40 active:opacity-[0.85]"
                  class="middle none font-sans font-bold center transition-all disabled:opacity-50 disabled:shadow-none disabled:pointer-events-none text-xs py-3 rounded-lg text-white hover:bg-white/10 active:bg-white/30 flex w-full items-center gap-4 px-4 capitalize" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="w-5 h-5 text-inherit">
              <path d="M11.47 3.84a.75.75 0 011.06 0l8.69 8.69a.75.75 0 101.06-1.06l-8.689-8.69a2.25 2.25 0 00-3.182 0l-8.69 8.69a.75.75 0 001.061 1.06l8.69-8.69z"></path>
              <path d="M12 5.432l8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 01-.75-.75v-4.5a.75.75 0 00-.75-.75h-3a.75.75 0 00-.75.75V21a.75.75 0 01-.75.75H5.625a1.875 1.875 0 01-1.875-1.875v-6.198a2.29 2.29 0 00.091-.086L12 5.43z"></path>
            </svg>
            <p class="block antialiased font-sans text-base leading-relaxed text-inherit font-medium capitalize">Inicio</p>
          </button>
        </a>
      </li>
     
    
     
      <ul class="w-full">
        <!-- 🔹 Menú de Conversaciones -->
        <li class="relative">
          <button (click)="toggleMenu('conversaciones')"
                  [ngClass]="{'bg-blue-600': isOpen === 'conversaciones'}"
                  class="middle none font-sans font-bold center transition-all text-xs py-3 rounded-lg text-white hover:bg-white/10 active:bg-white/30 flex w-full items-center gap-4 px-4 capitalize">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="w-5 h-5 text-inherit">
              <path d="M12 3a9 9 0 100 18 9 9 0 000-18zM7.22 10.87l1.66 1.66a1 1 0 01-1.41 1.41l-2-2a1 1 0 011.41-1.41zm4.59 4.59a1 1 0 01-1.41 0l-1.66-1.66a1 1 0 011.41-1.41l1.66 1.66a1 1 0 010 1.41zm3.88-3.88a1 1 0 01-1.41 0l-1.66-1.66a1 1 0 011.41-1.41l1.66 1.66a1 1 0 010 1.41z"></path>
            </svg>
            <p class="block font-sans text-base font-medium capitalize">Conversaciones</p>
            <span class="ml-auto transition-transform duration-300" [ngClass]="{'rotate-180': isOpen === 'conversaciones'}">▼</span>
          </button>

          <!-- Submenú Conversaciones -->
          <ul *ngIf="isOpen === 'conversaciones'" class="overflow-hidden transition-all duration-300 ease-in-out">
            <li>
              <a routerLink="/RegistrarMateria"
                 (click)="selectMenu('chat')"
                 [ngClass]="{'bg-blue-600': selectedMenu === 'chat'}"
                 class="block px-4 py-2 text-white hover:bg-gray-700">Chat</a>
            </li>
            <li>
              <a routerLink="/StudentClasses"
                 (click)="selectMenu('soporte')"
                 [ngClass]="{'bg-blue-600': selectedMenu === 'soporte'}"
                 class="block px-4 py-2 text-white hover:bg-gray-700">Soporte</a>
            </li>
          </ul>
        </li>

        <!-- 🔹 Menú de Campañas -->
        <li class="relative mt-2">
          <button (click)="toggleMenu('campañas')"
                  [ngClass]="{'bg-blue-600': isOpen === 'campañas'}"
                  class="middle none font-sans font-bold center transition-all text-xs py-3 rounded-lg text-white hover:bg-white/10 active:bg-white/30 flex w-full items-center gap-4 px-4 capitalize">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="w-5 h-5 text-inherit">
              <path d="M4 4h16v16H4V4zm2 2v12h12V6H6zm3 3h6v2H9V9zm0 4h6v2H9v-2z"></path>
            </svg>
            <p class="block font-sans text-base font-medium capitalize">Campañas</p>
            <span class="ml-auto transition-transform duration-300" [ngClass]="{'rotate-180': isOpen === 'campañas'}">▼</span>
          </button>

          <!-- Submenú Campañas -->
          <ul *ngIf="isOpen === 'campañas'" class="overflow-hidden transition-all duration-300 ease-in-out">
            <li>
              <a routerLink="/Publicidad"
                 (click)="selectMenu('Publicidad')"
                 [ngClass]="{'bg-blue-600': selectedMenu === 'Publicidad'}"
                 class="block px-4 py-2 text-white hover:bg-gray-700">Nueva Campaña</a>
            </li>
            <li>
              <a routerLink="/ListadoPublicidad"
                 (click)="selectMenu('ListadoPublicidad')"
                 [ngClass]="{'bg-blue-600': selectedMenu === 'ListadoPublicidad'}"
                 class="block px-4 py-2 text-white hover:bg-gray-700">Mis campañas</a>
            </li>
          </ul>
        </li>
      </ul>


      <li>
        <a routerLink="/ClassRegister">
          <button class="middle none font-sans font-bold center transition-all disabled:opacity-50 disabled:shadow-none disabled:pointer-events-none text-xs py-3 rounded-lg text-white hover:bg-white/10 active:bg-white/30 w-full flex items-center gap-4 px-4 capitalize" type="button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="w-5 h-5 text-inherit">
              <path d="M12 3a9 9 0 100 18 9 9 0 000-18zM7.22 10.87l1.66 1.66a1 1 0 01-1.41 1.41l-2-2a1 1 0 011.41-1.41zm4.59 4.59a1 1 0 01-1.41 0l-1.66-1.66a1 1 0 011.41-1.41l1.66 1.66a1 1 0 010 1.41zm3.88-3.88a1 1 0 01-1.41 0l-1.66-1.66a1 1 0 011.41-1.41l1.66 1.66a1 1 0 010 1.41z"></path>
            </svg>
            <p class="block antialiased font-sans text-base leading-relaxed text-inherit font-medium capitalize">Gastos</p>
          </button>
        </a>
      </li>


    </ul>

    <ul class="mb-4 flex flex-col gap-1">
      <li>
        <a class="" href="#">
          <button class="middle none font-sans font-bold center transition-all disabled:opacity-50 disabled:shadow-none disabled:pointer-events-none text-xs py-3 rounded-lg text-white hover:bg-white/10 active:bg-white/30 w-full flex items-center gap-4 px-4 capitalize"
                  type="button"
                  (click)="onLogout()">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" class="w-5 h-5 text-inherit">
              <path fill-rule="evenodd" d="M7.5 3.75A1.5 1.5 0 006 5.25v13.5a1.5 1.5 0 001.5 1.5h6a1.5 1.5 0 001.5-1.5V15a.75.75 0 011.5 0v3.75a3 3 0 01-3 3h-6a3 3 0 01-3-3V5.25a3 3 0 013-3h6a3 3 0 013 3V9A.75.75 0 0115 9V5.25a1.5 1.5 0 00-1.5-1.5h-6zm10.72 4.72a.75.75 0 011.06 0l3 3a.75.75 0 010 1.06l-3 3a.75.75 0 11-1.06-1.06l1.72-1.72H9a.75.75 0 010-1.5h10.94l-1.72-1.72a.75.75 0 010-1.06z" clip-rule="evenodd"></path>
            </svg>
            <p class="block antialiased font-sans text-base leading-relaxed text-inherit font-medium capitalize">Salir</p>
          </button>
        </a>
      </li>
    </ul>
  </div>
</aside>
